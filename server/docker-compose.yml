version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./sql_app.db:/app/sql_app.db
    env_file:
      - .env
    environment:
      - ENV=production
    restart: unless-stopped

